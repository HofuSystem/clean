><li data-list=\"ordered\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>Please prepare the areas to be cleaned in advance to ensure efficient use of time.<\/li><li data-list=\"ordered\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>Service hours start upon the arrival of the cleaning staff.<\/li><\/ol><p><strong>Cleaning Staff:<\/strong><\/p><p>Our cleaning staff are highly trained and reliable, committed to delivering exceptional service. However, we strongly recommend securing your personal belongings and valuable items in a safe place, as the company is not responsible for any loss or damage.<\/p><p><strong>Included Services:<\/strong><\/p><ol><li data-list=\"ordered\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>Dusting and vacuuming.<\/li><li data-list=\"ordered\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>Cleaning floors and bathrooms.<\/li><li data-list=\"ordered\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>Cleaning kitchen surfaces and small appliances.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>Wiping down glass and other surfaces.<\/li><\/ol><p>With the daily visit service, enjoy comprehensive cleaning and complete convenience that meets your daily needs with the highest standards of quality and flexibility.<\/p>","image":"http:\/\/localhost:8000\/storage\/images\/CdaLUvymJwh8UCjtZVSl3ZFC7chSWz1AysS9YQbs.jpg","availability":{"is_available":false,"message":"Service is not available in your area"},"is_fav":false},"created_at":"25-01-01"}],"sales":[],"sub_services":[{"id":71,"parent_id":61,"name":"Flexible Home Visit","intro":"Daily Visit Service","desc":"<h3><strong>Daily Visit Service<\/strong><\/h3><p><strong>General Information:<\/strong><\/p><p>The daily visit service offers flexible and customized cleaning solutions to meet your household needs with ease and high quality. You can select the number of cleaning staff, the required hours, and the expected arrival time to ensure a comfortable and tailored experience.<\/p><p><strong>Service Details:<\/strong><\/p><ol><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>Choose the number of cleaning staff based on the size of the work or your home.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>Specify the required number of hours based on your cleaning needs.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>The expected arrival time will be determined during booking to fit your schedule.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>Use of professional and safe cleaning materials on all surfaces.<\/li><\/ol><p><strong>Important Guidelines:<\/strong><\/p><ol><li data-list=\"ordered\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>A woman must be present to receive the cleaning staff upon arrival.<\/li><li data-list=\"ordered\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>Please prepare the areas to be cleaned in advance to ensure efficient use of time.<\/li><li data-list=\"ordered\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>Service hours start upon the arrival of the cleaning staff.<\/li><\/ol><p><strong>Cleaning Staff:<\/strong><\/p><p>Our cleaning staff are highly trained and reliable, committed to delivering exceptional service. However, we strongly recommend securing your personal belongings and valuable items in a safe place, as the company is not responsible for any loss or damage.<\/p><p><strong>Included Services:<\/strong><\/p><ol><li data-list=\"ordered\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>Dusting and vacuuming.<\/li><li data-list=\"ordered\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>Cleaning floors and bathrooms.<\/li><li data-list=\"ordered\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>Cleaning kitchen surfaces and small appliances.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>Wiping down glass and other surfaces.<\/li><\/ol><p>With the daily visit service, enjoy comprehensive cleaning and complete convenience that meets your daily needs with the highest standards of quality and flexibility.<\/p>","image":"http:\/\/localhost:8000\/storage\/images\/CdaLUvymJwh8UCjtZVSl3ZFC7chSWz1AysS9YQbs.jpg","availability":{"is_available":false,"message":"Service is not available in your area"},"is_fav":false},{"id":72,"parent_id":61,"name":"Scheduled visits","intro":"Fits Your Schedule","desc":"<h4><strong>Flexible Scheduled Visits<\/strong><\/h4><h4><strong>Service Description:<\/strong><\/h4><h4>The <strong>Flexible Scheduled Visits<\/strong> service allows you to organize regular cleaning visits for a full month with ease and convenience. You can choose the number of weekly visits, the number of cleaners, and the preferred days and times, all tailored to fit your needs.<\/h4><h4><strong>How It Works:<\/strong><\/h4><ol><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span><strong>Choose Weekly Visits:<\/strong><\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>1 visit per week = 4 visits per month.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>2 visits per week = 8 visits per month.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>3 visits per week = 12 visits per month.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>4 visits per week = 16 visits per month.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span><strong>Customize Your Service:<\/strong> Select the number of cleaners and schedule the days and times for each visit.<\/li><\/ol><h4><strong>Features:<\/strong><\/h4><ol><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span><strong>Convenience:<\/strong> Schedule all your visits for an entire month in one step.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span><strong>Flexibility:<\/strong> Choose the frequency, cleaners, and timings that work best for you.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span><strong>Easy Management:<\/strong> Track and adjust your visits easily through the app.<\/li><\/ol><h4><strong>Terms and Conditions:<\/strong><\/h4><ol><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>A woman must be present at home to receive the cleaners upon arrival.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>Please ensure that the areas to be cleaned are prepared beforehand for optimal efficiency.<\/li><\/ol><h4><strong>Cancellation Policy:<\/strong><\/h4><ol><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>Appointments can be modified or canceled at least 24 hours in advance by contacting customer service.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>If no one is present or the driver\u2019s call is not answered upon arrival, the visit will be considered canceled and non-refundable.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>The company\u2019s general terms and conditions apply to all visits.<\/li><\/ol><h4><strong>Important Note:<\/strong><\/h4><h4>While our cleaning staff are highly trained and adhere to professional standards, we strongly recommend keeping personal belongings and valuables in a secure place. The company is not responsible for any loss or damage to these items.<\/h4>","image":"http:\/\/localhost:8000\/storage\/images\/HpQIP3UcXoEE23HCKya7dQ9is0PSSA4CXQo4BSQ4.jpg","availability":{"is_available":false,"message":"Service is not available in your area"},"is_fav":false},{"id":73,"parent_id":61,"name":"Resident Worker Packages","intro":"Resident Worker Packages Coming Soon!","desc":"<h3>At <strong>Clean Station<\/strong>, we are meticulously training and preparing resident workers to deliver exceptional services that meet your daily needs with professionalism and precision. Soon, you will have the option to choose the perfect package that suits your requirements:<\/h3><ol><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span><strong>Flexible Package<\/strong>: A variety of options tailored to your daily schedule and changing needs, offering the flexibility you desire.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span><strong>Fixed Package<\/strong>: Carefully scheduled services designed to provide peace of mind and consistent fulfillment of your needs.<\/li><\/ol><h3>Stay tuned for a new level of quality and professionalism in home services!<\/h3>","image":"http:\/\/localhost:8000\/storage\/images\/zR5xKWO3Lm3ymCFnfdZzkczAekGQQSlZRLB6XYiC.png","availability":{"is_available":false,"message":"Service is not available in your area"},"is_fav":false}]}}'
