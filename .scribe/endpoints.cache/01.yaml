        custom: []
        status: 200
        content: '{"status":"success","message":"Terms","data":{"terms":"<h1>Terms and Conditions - Clean Station Application<\/h1><p><strong>Clean Station application aims to provide distinguished services to customers. Below are the terms and conditions under which you must use the application:<\/strong><\/p><h3>1. Definition of Terms<\/h3><ol><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span><strong>\"You\" and \"Your\"<\/strong>: Refers to the person intending to order from the Clean Station services application, who must be over 18 years of age.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span><strong>\"Clean Station\", \"We\", or \"Us\"<\/strong>: Refers to the company with its registered office in Jeddah: 2823 Al Rawdah St, Unit No. 99, Al Rawdah Dist, Jeddah 23431 - 7092, Saudi Arabia.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span><strong>\"Home Page\"<\/strong>: Refers to the main page of the application that displays the application sections and the brands we represent.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span><strong>\"Sections\"<\/strong>: Refers to the categories and subcategories available on our application.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span><strong>\"Account\"<\/strong>: Refers to your details and order history created upon registration to order through our Clean Station services application.<\/li><\/ol><h3>2. Terms of Use<\/h3><ol><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>This section explains how to access and use the application.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span><strong>2.1 Application Use and Access<\/strong><\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>2.1.1 It will be necessary for us to perform maintenance on the application from time to time, which may result in brief downtimes.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>2.1.2 We cannot promise that the application will be free of downtimes or errors, or that application defects will be corrected.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>2.1.3 You may use the application to browse and purchase services and products from us and manage your own account, but not for any other purpose.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>2.1.4 You must not share your Clean Station services application email\/username and password with anyone.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>2.1.5 A single user is not entitled to have more than one account on the application.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>2.1.6 If a single user has more than one account, Clean Station has the right to suspend the account.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>2.1.7 In case of fraud or suspicion thereof, Clean Station has the right to suspend the transaction and the account.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span><strong>2.2 Application Content<\/strong><\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>2.2.1 We may update the application from time to time and may change the content at any time; however, please note that we are not obligated to update the content.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>2.2.2 We do not guarantee that the application or any content on it will be free from errors or omissions.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>2.2.3 All rights shall be automatically owned by Clean Station, including but not limited to any intellectual property rights in any data on the application or any part of the application provided by us, you, or any third party.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>2.2.4 You are responsible for configuring your information technology, computer programs, and platform to access the application; you must use your own anti-virus software.<\/li><\/ol><h3>3. Terms of Service Ordering and Sale<\/h3><ol><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>These terms of sale will apply if you place a service order or purchase on our application.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span><strong>3.1 How to Become a Customer<\/strong><\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>3.1.1 To place an order for laundry and cleaning services or purchase goods on our application, you must be over 18 years old and request delivery and collection in your area. You must have a credit or debit card accepted by us or agree to pay Cash on Delivery (COD).<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>3.1.2 Upon registration, you will create a username and use your mobile number to receive a verification code via SMS; you must use these whenever you log in. You must maintain the confidentiality of these details and are responsible for all activities and orders placed under your account.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>3.1.3 We reserve the right to suspend accounts related to any fraudulent activity or misuse of the service.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span><strong>3.2 Our Contract<\/strong><\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>3.2.1 After placing an order, we will send you a notification acknowledging receipt and displaying the price; this does not constitute final confirmation or acceptance of the order.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>3.2.2 These terms govern the provision of laundry and cleaning services to you by Clean Station.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span><strong>3.3 Pricing<\/strong><\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>3.3.1 The price of the item(s) ordered will be the price displayed on the application at the time of placing or amending your order.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>3.3.2 If a service or product is listed at an incorrect price due to a pricing error, we reserve the right to contact you for guidance or cancel the order.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>3.3.3 In addition to the price, you may be required to pay delivery or collection fees as indicated in the payment section.<\/li><\/ol><h3>4. Wallet and Credit System<\/h3><ol><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>4.1 The Clean Station Wallet is a closed-loop internal credit system intended exclusively for paying for services and products within the application; it does not represent a bank account and funds cannot be transferred outside the application or between users.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>4.2 The application adheres to a maximum wallet balance not exceeding 1,000 SAR at any time to ensure transaction security and regulatory compliance.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>4.3 Amounts topped up in the wallet or balances resulting from \"remaining change\" are non-refundable as cash and cannot be transferred to bank accounts; they are used only as credit for future orders. Refunds are processed to the original payment source via the payment gateway.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>4.4 Balances added as a \"Gift\" or \"Bonus\" are promotional marketing credits with no cash value and are consumed after the paid balance is exhausted.<\/li><\/ol><h3>5. Support, Complaints, and Inquiries<\/h3><ol><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>Please contact the customer service team as detailed on the platform.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>You must inform us as soon as possible if there is a problem with the services or a complaint within 48 hours of receiving the order.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>We will contact you via phone, email, application notifications, or SMS using the contact details provided.<\/li><\/ol><h3>6. Liability for Loss or Damage to Laundry and Furnishings<\/h3><ol><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span><strong>5.1 Compensation for Damage or Loss<\/strong><\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>If Clean Station causes damage or loss to items owned by the customer, the company will compensate the customer based on the value of the damaged item.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>Compensation is provided provided it does not exceed six times the basic laundry or ironing price of the single item.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span><strong>5.2 Determining Compensation Value<\/strong><\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>Compensation is determined based on the condition of the item before receipt, the original value (if supported by invoice), and the estimated market value.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span><strong>5.3 Limitation of Liability<\/strong><\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>Clean Station assumes no responsibility for damage resulting from fabric weakness, natural wear and tear, or natural color fading.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>The customer must submit a claim for compensation within no more than 48 hours of receiving the item.<\/li><\/ol><h3>7. Use of Promotional Codes<\/h3><ol><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>Only one (1) promotional code can be redeemed per user account\/per household\/per promotion.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>Promotional codes can only be redeemed via the application and must be entered at the point of order entry.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>Promotional codes are free promotional vouchers with no cash value and have an expiration date displayed on the application.<\/li><\/ol><h3>8. Payment<\/h3><ol><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>All monetary transfers and payments must be in Saudi Riyals (SAR).<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>Online payment methods include Credit Cards (Visa or MasterCard) and Mada cards issued by Saudi banks through our service provider''s gateway (<strong>MyFatoorah<\/strong>).<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>We do not store your credit card information on the application; all details entered through the payment gateway are encrypted for security.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>If the order value is less than the amount paid, the remaining balance will be returned as credit to the application wallet, subject to the terms in Section 4.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>Partial payments cannot be refunded on Mada cards.<\/li><\/ol><h3>9. Apple Pay<\/h3><ol><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>Apple Pay is an electronic payment service available for iOS systems provided by Apple.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>To use it, you must use the Apple Wallet application to save your payment card data.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>In case of order cancellation, the amount will be returned to the payment source or as a remaining balance in the wallet.<\/li><\/ol><h3>10. Technical and Legal Compliance<\/h3><ol><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>10.1 Clean Station is a laundry and cleaning service provider platform connecting customers with service providers, and does not provide any direct Voice over IP (VoIP) or video communication services subject to licenses from the Communications, Space and Technology Commission (CST).<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>10.2 Clean Station reserves the right to suspend or freeze any account or wallet balance in case of suspected activities violating Anti-Money Laundering or Cybercrime laws in the Kingdom of Saudi Arabia.<\/li><\/ol><p class=\"ql-align-center\"><br><\/p>"}}'
