        status: 200
        content: '{"status":"success","message":"Policy","data":{"policy":"<h1>Privacy Policy - Clean Station Application<\/h1><p>This Privacy Policy outlines how <strong>Clean Station<\/strong> uses and protects any information you provide when using this application. We are committed to ensuring that your privacy is protected. Should we ask you to provide certain information by which you can be identified when using this application, you can be assured that it will only be used in accordance with this privacy statement. <strong>Clean Station<\/strong> may change this policy from time to time by updating this page. You should check this page periodically to ensure that you are satisfied with any changes.<\/p><h3>Information We Collect<\/h3><p>We may collect the following information to ensure efficient service delivery:<\/p><ol><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>Full Name.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>Contact information, including mobile number and email address.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>Geographic location (GPS) and residential address to ensure accurate delivery of laundry and cleaning services.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>Preferences and interests related to home services.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>Other information relevant to customer surveys and\/or promotional offers.<\/li><\/ol><h3>What We Do with the Information We Gather<\/h3><p>We require this information to understand your needs and provide you with a better service, specifically for the following reasons:<\/p><ol><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>Internal record keeping and order management.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>Using the information to improve our laundry and cleaning services and products.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>Periodically sending promotional messages or Push Notifications through the application regarding new services, special offers, or other information we think you may find interesting.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>From time to time, we may use your information to contact you for market research purposes via email, phone, or in-app notifications.<\/li><li data-list=\"bullet\"><span class=\"ql-ui\" contenteditable=\"false\"><\/span>Using the information to customize the application interface according to your interests and personal preferences.<\/li><\/ol><h3>Security<\/h3><p>We are committed to ensuring that your information is secure. To prevent unauthorized access or disclosure of your private data, we have put in place suitable physical, electronic, and managerial procedures to safeguard and secure the information we collect online through the application.<\/p><h3>How We Use Cookies and Technical Data<\/h3><h4 class=\"ql-align-center\">Software technologies are used to identify you as an individual and tailor the application''s operations to your specific needs and preferences. Analyzing data traffic within the app helps us improve performance and adapt the service to suit customer requirements. We use this information for statistical analysis purposes only, after which the data is removed from the system. Overall, these tools help us provide you with a better experience by enabling us to monitor which features you find useful. They do not give us access to your device or any information about you, other than the data you explicitly choose to share with us.<\/h4>"}}'
