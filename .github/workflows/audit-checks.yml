name: Audit checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-audit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_sqlite, gd, zip, bcmath
          coverage: none
          tools: composer:v2
      - name: Install locked dependencies without application scripts
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Run isolated audit tests
        run: php vendor/phpunit/phpunit/phpunit tests/Feature/Audit tests/Unit/Audit --no-progress --fail-on-risky --fail-on-warning

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit --package-lock-only --audit-level=moderate
      - run: npm run build

  php-dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      # Remains red while the documented PHP dependency advisories are open.
      - run: composer audit --locked --no-dev
